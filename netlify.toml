# === Netlify Configuration File ===

[build]
  # FIX: Change the command from "npm run start" to "npm run build"
  # This tells Netlify to run the finite build process, not the infinite development server.
  # Also ensure devDependencies are installed since Eleventy is a devDependency
  command = "npm ci --include=dev && npm run build" 
  publish = "_site"
  functions = "netlify/functions"

[dev]
  command = "npx @11ty/eleventy --serve --port=8080"
  targetPort = 8080
  port = 8888
  publish = "_site"
  autoLaunch = false

# --- SEO Redirect Rules ---

# Rule 1: Redirect the old specific .html page to its new canonical URL
[[redirects]]
  from = "/documentation.html"
  to = "/features/"
  status = 301 # Permanent Redirect

# Rule 2: Redirect the old clean URL to its new canonical URL
[[redirects]]
  from = "/documentation/"
  to = "/features/"
  status = 301 # Permanent Redirect

# Rule 3: Redirect old blog slug (indexed in Google, broken internal link) to correct URL
[[redirects]]
  from = "/blog/copy-custom-definitions-ga4/"
  to = "/blog/copy-custom-dimensions-definitions/"
  status = 301 # Permanent Redirect

# Rule 3: Enforce Trailing Slashes sitewide for consistency
[[redirects]]
  from = "/:slug"
  to = "/:slug/"
  status = 301
  conditions = {path = "!/\\.html$|/\\.xml$|/\\.txt$|/\\.png$|/\\.jpg$|/\\.svg$|/\\.mp4$|/\\.js$|/\\.css$"}

# --- Security Headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --- Cache Headers ---
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mp4/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"